<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>University StudyHub – Prototype</title>
<style>
:root{--bg:#f7f4f4;--card:#fff;--ink:#241a1a;--mut:#6b5d5d;--pri:#a81c1c;--tint:#fbeaea;--line:#e6dcdc;--ok:#2e7d32;--warn:#b26a00;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0f;--card:#211817;--ink:#f3eae9;--mut:#b9a9a7;--pri:#c93a3a;--tint:#2e1a1a;--line:#3a2b2a;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f0f;--card:#211817;--ink:#f3eae9;--mut:#b9a9a7;--pri:#c93a3a;--tint:#2e1a1a;--line:#3a2b2a;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pri);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header .sp{flex:1}
.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}
nav{background:var(--card);border-right:1px solid var(--line);padding:12px 8px}
nav a{display:block;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--ink);margin-bottom:2px}
nav a.on{background:var(--tint);color:var(--pri);font-weight:600}
main{padding:20px;max-width:960px;width:100%}
h2{margin:0 0 4px;font-size:22px}.obj{display:inline-block;font-size:12px;background:var(--tint);color:var(--pri);padding:2px 8px;border-radius:99px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.grid .card{margin:0}.grid{margin-bottom:12px}
.unit{cursor:pointer}.unit:hover,.unit.sel{border-color:var(--pri);background:var(--tint)}
.unit b{font-size:17px}.tiles b{font-size:26px;color:var(--pri)}
.stat b{display:block;font-size:26px;color:var(--pri)}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;min-height:44px}
button.ghost{background:var(--tint);color:var(--pri)}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--tint);color:var(--pri)}
.hi{color:var(--pri);font-weight:600}.med{color:var(--warn);font-weight:600}.lo{color:var(--ok);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.done{text-decoration:line-through;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px}
.auth{max-width:420px;margin:0 auto;padding:28px 16px}.auth .logo{text-align:center;font-size:44px}.auth h1{text-align:center;margin:4px 0 2px;font-size:24px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}.fld input,.fld select{width:100%}
.err{color:var(--pri);font-size:13px;min-height:18px;margin-bottom:8px}.link{color:var(--pri);background:none;border:0;padding:0;min-height:0;font-size:13px;text-decoration:underline}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.demo button{padding:6px 10px;min-height:36px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:20}
small{color:var(--mut)}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:8}nav a{white-space:nowrap;margin:0 4px 0 0}main{padding:14px}}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),D=n=>{const d=new Date();d.setDate(d.getDate()+n);return d},fd=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)};
const S={role:"Student",view:"dash",user:null,mode:"login",err:"",unit:null,tab:"books",qi:null,ot:null,extra:0,
acc:[{e:"student@university.ac.ke",p:"student123",n:"Tonny Ariwi",r:"Student"},{e:"instructor@university.ac.ke",p:"instructor123",n:"Grace Mwangi",r:"Instructor"},{e:"admin@university.ac.ke",p:"admin123",n:"Admin Office",r:"Administrator"}],
units:[["CSC 311","Database Systems",78],["CSC 325","Software Engineering",64],["CSC 429","Computer Project",45]],
res:[{t:"Week 3 Slides – Normalisation",c:0,k:"Slides",x:"Week 3"},{t:"ER Modelling Notes",c:0,k:"Notes",x:"Week 2"},{t:"CAT 1 Past Paper",c:0,k:"Past paper",x:"2024"},{t:"UML Reading Pack",c:1,k:"Reading",x:"Week 4"},{t:"End-of-Semester Exam",c:1,k:"Past paper",x:"2023"},{t:"Project Guidelines",c:2,k:"Notes",x:"Week 1"}],
tasks:[{t:"Database assignment 2",c:0,d:3,w:15,h:4,done:0,a:1},{t:"SRS document draft",c:1,d:6,w:20,h:6,done:0,a:1},{t:"Chapter 3 proposal",c:2,d:9,w:10,h:5,done:0,a:1},{t:"CAT 2 revision",c:0,d:12,w:20,h:6,done:0},{t:"Reading: UML chapter",c:1,d:2,w:5,h:2,done:1,m:80},{t:"Assignment 1",c:0,d:-7,w:10,h:3,done:1,m:72,a:1,sub:"assignment1.pdf"}],
quizzes:[{c:0,t:"Normalisation Quiz",qs:[{q:"Which normal form removes partial dependencies?",o:["1NF","2NF","3NF"],a:1},{q:"A primary key must be…",o:["Unique and not null","Repeated","Optional"],a:0},{q:"ERD stands for…",o:["Entity Relationship Diagram","Easy Report Data","Entity Record Directory"],a:0}]},{c:1,t:"UML Basics Quiz",qs:[{q:"Which diagram shows actors and their goals?",o:["Use case diagram","Class diagram","Gantt chart"],a:0},{q:"An abstract class…",o:["Cannot be instantiated","Has no methods","Is always private"],a:0}]},{c:2,t:"Research Methods Quiz",qs:[{q:"A questionnaire is mainly used to…",o:["Collect data from many people","Test code","Draw diagrams"],a:0},{q:"Informed consent means participants…",o:["Agree voluntarily after being told the purpose","Are paid","Stay anonymous only"],a:0}]}],
qs:{i:0,ans:[],fin:false},sc:[[60,75],[70],[]],
th:[{t:"When is the ER diagram assignment due?",c:0,by:"Brian Otieno",ans:1,p:[["Brian Otieno","Is it due this Friday or next week?"],["Grace Mwangi","Next Friday, submitted on the portal."]]},{t:"Difference between 2NF and 3NF?",c:0,by:"Tonny Ariwi",ans:0,p:[["Tonny Ariwi","I keep mixing these up. Any simple example?"]]},{t:"Which UML tool should we use?",c:1,by:"Faith Njeri",ans:0,p:[["Faith Njeri","Is draw.io fine for the SRS diagrams?"],["Kevin Mutua","Yes, it exports to PNG and PDF."]]},{t:"How many respondents do we need?",c:2,by:"Tonny Ariwi",ans:0,p:[["Tonny Ariwi","Is 40 students enough for the questionnaire?"]]}],
msgs:[{f:"Grace Mwangi",t:"Chapter 3 drafts are due Friday. Bring your questions to the consultation.",c:2},{f:"Grace Mwangi",t:"CAT 2 covers weeks 1–4.",c:0}],
av:[2,2,2,2,2,3,3],plan:null,users:[["Tonny Ariwi","Student"],["Brian Otieno","Student"],["Grace Mwangi","Instructor"],["Admin Office","Administrator"]]};
const NAV={Student:[["dash","Dashboard"],["res","My Units"],["tasks","Tasks"],["plan","Study Planner"],["quiz","Quizzes"],["disc","Discussions"],["prog","Progress"],["msgs","Messages"],["rep","Reports"]],
Instructor:[["dash","Dashboard"],["res","My Units"],["quiz","Quizzes"],["disc","Discussions"],["cls","Class Progress"],["msgs","Messages"],["rep","Reports"]],
Administrator:[["dash","Dashboard"],["usr","Users and Units"],["rep","Reports"]]};
const H=(t,o)=>`<h2>${t}</h2><span class="obj">${o}</span>`,U=i=>S.units[i][0]+" "+S.units[i][1],stu=i=>S.units[i][2]+S.extra,total=()=>120+S.extra,ofU=(a,i)=>a.filter(x=>x.c==i);
const pr=t=>{const s=t.w/Math.max(t.d,1);return[s,s>=4?["High","hi"]:s>=1.5?["Medium","med"]:["Low","lo"]]},pend=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>pr(b)[0]-pr(a)[0]),pct=()=>Math.round(S.tasks.filter(t=>t.done).length/S.tasks.length*100);
const grade=()=>{const d=S.tasks.filter(t=>t.done&&t.m),w=d.reduce((a,t)=>a+t.w,0),mw=d.reduce((a,t)=>a+t.m*t.w,0);return{avg:w?Math.round(mw/w):0,w,need:Math.max(0,Math.min(100,Math.round((7000-mw)/(100-w))))}};
const ust=i=>{const T=ofU(S.tasks,i),d=T.filter(t=>t.done).length,sc=S.sc[i]||[],mk=T.filter(t=>t.m);return{d,n:T.length,p:T.length?Math.round(d/T.length*100):0,qa:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null,m:mk.length?Math.round(mk.reduce((a,t)=>a+t.m,0)/mk.length):null}};
const tbl=(h,r)=>`<div class="card"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table></div>`;
const openU=(i,t)=>{S.unit=i;S.tab=t;S.qi=null;S.ot=null;R()};
const unitCards=(tab,t,o)=>H(t,o)+`<div class="grid">${S.units.map((u,i)=>`<div class="card unit" onclick="openU(${i},'${tab}')"><b>${u[0]}</b><br>${u[1]}<br><small>${ofU(S.res,i).length} books · ${S.tasks.filter(x=>x.a&&x.c==i).length} assignments · ${ofU(S.quizzes,i).length} quizzes · ${ofU(S.th,i).length} discussions${S.role!="Student"?" · "+stu(i)+" students":""}</small></div>`).join("")}</div>`;
function mkPlan(){const T=pend().map(t=>({...t,left:t.h})),days=[...Array(7)].map((_,i)=>({d:D(i),free:S.av[(D(i).getDay()+6)%7],it:[]}));T.forEach(t=>days.forEach((day,i)=>{if(t.left>0&&day.free>0&&i<=t.d){const u=Math.min(t.left,day.free);day.it.push([t,u]);day.free-=u;t.left-=u}}));S.plan=days;R();toast("Study plan generated from deadlines, weights and your free hours")}
const bks=(i,ins)=>(ins?`<div class="card"><div class="row"><input id="ut" placeholder="Title" style="flex:1"><select id="uk"><option>Slides</option><option>Notes</option><option>Reading</option><option>Past paper</option></select><button onclick="S.res.unshift({t:$('#ut').value||'Untitled',c:${i},k:$('#uk').value,x:'New'});R();toast('Resource published to students')">Upload</button></div></div>`:"")+`<div class="card">${ofU(S.res,i).map(r=>`<div class="item"><div>${r.t}<br><small>${r.x}</small></div><span class="tag">${r.k}</span></div>`).join("")||"<small>No resources yet.</small>"}</div>`;
const asg=(i,ins)=>(ins?`<div class="card"><b>Create assignment</b><div class="row"><input id="at" placeholder="Title" style="flex:1"><input id="ad" type="date"><input id="aw" type="number" placeholder="Weight %" style="width:110px"><button onclick="addAsg(${i})">Create</button></div></div>`:"")+`<div class="card">${S.tasks.map((t,k)=>[t,k]).filter(([t])=>t.a&&t.c==i).map(([t,k])=>`<div class="item" style="align-items:flex-start"><div>${t.t}<br><small>due ${fd(D(t.d))} · ${t.w}%</small>${ins?`<br><small>${Math.round(stu(i)*(t.done?.9:.3))} of ${stu(i)} submitted</small>`:t.sub?`<br><small>Submitted: ${t.sub}</small>`:`<div class="row" style="margin-top:6px"><input id="f${k}" placeholder="File name, e.g. report.pdf"><button onclick="submitA(${k})">Submit</button></div>`}</div><span class="${t.done?"lo":"med"}">${ins?"Open":t.done?"Submitted":"Pending"}</span></div>`).join("")||"<small>No assignments yet.</small>"}</div>`;
const qz=(i,ins)=>{if(S.qi!==null){const q=S.quizzes[S.qi],s=S.qs;if(s.fin){const n=s.ans.filter((a,j)=>a==q.qs[j].a).length;return `<div class="card"><b>${q.t}: ${n} / ${q.qs.length}</b> (${Math.round(n/q.qs.length*100)}%)${q.qs.map((x,j)=>`<p>${j+1}. ${x.q}<br><span class="${s.ans[j]==x.a?"lo":"hi"}">${s.ans[j]==x.a?"Correct":"Incorrect"}</span> · Answer: ${x.o[x.a]}</p>`).join("")}<button onclick="S.qi=null;R()">Back to quizzes</button></div>`}const x=q.qs[s.i];return `<div class="card"><small>${q.t} · Question ${s.i+1} of ${q.qs.length} · Timer 10:00</small><p><b>${x.q}</b></p>${x.o.map((o,j)=>`<button class="opt" onclick="ans(${j})">${o}</button>`).join("")}</div>`}
return (ins?`<div class="card"><b>Create quiz</b><div class="row"><input id="qt" placeholder="Quiz title"><input id="qq" placeholder="Question" style="flex:1"><input id="qa" placeholder="Correct answer"><input id="qw" placeholder="Wrong answer"><button onclick="addQuiz(${i})">Create</button></div></div>`:"")+`<div class="card">${S.quizzes.map((q,k)=>[q,k]).filter(([q])=>q.c==i).map(([q,k])=>`<div class="item"><div>${q.t}<br><small>${q.qs.length} questions · timed${(S.sc[i]||[]).length&&!ins?" · last score "+S.sc[i].slice(-1)[0]+"%":""}</small></div>${ins?`<span class="tag">Auto-marked</span>`:`<button onclick="S.qi=${k};S.qs={i:0,ans:[],fin:false};R()">Start</button>`}</div>`).join("")||"<small>No quizzes yet.</small>"}</div>`};
const dsc=i=>{const o=S.ot;if(o!==null){const t=S.th[o],can=S.role!="Student"||t.by==S.user.name;return `<button class="ghost" onclick="S.ot=null;R()">← Back to threads</button><h3 style="margin:12px 0 4px">${t.t}</h3><span class="obj">started by ${t.by}${t.ans?" · Answered":""}</span><div class="card">${t.p.map(([b,x],j)=>`<div class="item"><div><b>${b}</b>${j&&t.ans==j?` <span class="tag">Best answer</span>`:""}<br>${x}</div>${j&&can&&t.ans!=j?`<button class="ghost" onclick="S.th[${o}].ans=${j};R();toast('Marked as the best answer')">Mark best answer</button>`:""}</div>`).join("")}</div><div class="card"><div class="row"><input id="rp" placeholder="Write a reply" style="flex:1"><button onclick="S.th[${o}].p.push([S.user.name,$('#rp').value||'(empty)']);R();toast('Reply posted; participants notified')">Reply</button></div></div>`}
return `<div class="card"><div class="row"><input id="dt" placeholder="Start a new discussion" style="flex:1"><button onclick="newTh(${i})">Post</button></div></div><div class="card">${S.th.map((t,k)=>[t,k]).filter(([t])=>t.c==i).map(([t,k])=>`<div class="item" style="cursor:pointer" onclick="S.ot=${k};R()"><div>${t.t}<br><small>${t.by} · ${t.p.length-1} replies</small></div><span class="tag">${t.ans?"Answered":"Open"}</span></div>`).join("")||"<small>No discussions yet.</small>"}</div>`};
function unitPage(){const i=S.unit,t=S.tab,ins=S.role=="Instructor",A=S.tasks.filter(x=>x.a&&x.c==i).length;
const tile=(k,l,n)=>`<div class="card unit ${t==k?"sel":""}" onclick="S.tab='${k}';S.qi=null;S.ot=null;R()"><b>${n}</b><br>${l}</div>`;
return `<button class="ghost" onclick="S.unit=null;R()">← All units</button><h2 style="margin-top:12px">${U(i)}</h2><span class="obj">${stu(i)} students enrolled</span><div class="grid tiles">${tile("books","Books and notes",ofU(S.res,i).length)}${tile("assign","Assignments",A)}${tile("quiz","Quizzes",ofU(S.quizzes,i).length)}${tile("disc","Discussions",ofU(S.th,i).length)}</div>`+({books:bks,assign:asg,quiz:qz,disc:dsc}[t])(i,ins)}
const unitView=(tab,t,o)=>S.unit!==null?unitPage():unitCards(tab,t,o);
const V={
dash(){const n=pend().slice(0,3),a=S.msgs[0];
if(S.role=="Instructor")return H("Instructor dashboard","Objectives 1, 5 and 6")+`<div class="grid"><div class="card stat"><b>${S.units.length}</b>Units taught</div><div class="card stat"><b>${total()}</b>Students overall</div><div class="card stat"><b>18</b>Assignments to mark</div></div><div class="card"><b>Latest announcement</b><p>${a.t}</p></div><button onclick="S.view='res';R()">Open my units</button>`;
if(S.role=="Administrator")return H("Administrator dashboard","Objectives 1 and 6")+`<div class="grid"><div class="card stat"><b>${total()}</b>Students overall</div><div class="card stat"><b>${S.units.length}</b>Active units</div><div class="card stat"><b>${S.res.length}</b>Resources stored</div></div><h3>Students per unit</h3><div class="grid">${S.units.map((u,i)=>`<div class="card"><b>${u[0]}</b> <small>${u[1]}</small><p class="stat"><b>${stu(i)}</b>students</p><div class="bar"><i style="width:${Math.round(stu(i)/total()*100)}%"></i></div></div>`).join("")}</div>`;
return H("Welcome back, "+S.user.name.split(" ")[0],"Overview of Objectives 1–6")+`<div class="grid"><div class="card stat"><b>${pend().length}</b>Tasks pending</div><div class="card stat"><b>${pct()}%</b>Tasks completed</div><div class="card stat"><b>${grade().avg}%</b>Average mark so far</div></div><div class="card"><b>Next deadlines</b>${n.map(t=>`<div class="item"><div>${t.t}<br><small>${U(t.c)} · due ${fd(D(t.d))}</small></div><span class="${pr(t)[1][1]}">${pr(t)[1][0]}</span></div>`).join("")}</div><div class="card"><b>Announcement</b><p>${a.t}</p><small>${a.f}</small></div><button onclick="S.view='res';R()">Open my units</button> <button class="ghost" onclick="S.view='plan';R()">Study planner</button>`},
res(){return unitView("books","My units","Objective 1 · Resources and assignments organised by unit")},
quiz(){return unitView("quiz","Quizzes by unit","Objective 4 · Timed quizzes with auto-marking")},
disc(){return unitView("disc","Discussions by unit","Objective 5 · Course discussion boards")},
tasks(){const all=[...pend(),...S.tasks.filter(t=>t.done)];return H("Tasks and deadlines","Objective 2 · Task manager with reminders")+`<div class="card"><div class="row"><input id="nt" placeholder="New task"><select id="nc">${S.units.map((u,i)=>`<option value=${i}>${u[0]}</option>`).join("")}</select><input id="nd" type="date"><input id="nw" type="number" min="1" max="100" placeholder="Weight %" style="width:110px"><button onclick="addTask()">Add</button></div><small>Priority = grade weight ÷ days remaining. A reminder is sent 24 hours before each due date.</small></div><div class="card">${all.map(t=>`<div class="item"><label class="${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} onchange="S.tasks[${S.tasks.indexOf(t)}].done=this.checked?1:0;S.plan=null;R()"> ${t.t}<br><small>${U(t.c)} · due ${fd(D(t.d))} · ${t.w}%</small></label><span class="${pr(t)[1][1]}">${t.done?"Done":pr(t)[1][0]}</span></div>`).join("")}</div>`},
plan(){const hs=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];return H("Study planner","Objective 3 · Personalised weekly schedule")+`<div class="card"><b>Free study hours per day</b><div class="row">${S.av.map((h,i)=>`<label>${hs[i]}<br><input type="number" min="0" max="12" value="${h}" style="width:64px" onchange="S.av[${i}]=+this.value"></label>`).join("")}</div><button onclick="mkPlan()">Generate plan</button></div>`+(S.plan?S.plan.map(d=>`<div class="card"><b>${d.d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}</b>${d.it.length?d.it.map(([t,u])=>`<div class="item"><div>${t.t}<br><small>${U(t.c)}</small></div><span class="tag">${u} h</span></div>`).join(""):"<div><small>Rest day or no free hours</small></div>"}</div>`).join(""):"<small>Set your free hours, then generate a plan. The plan re-balances when tasks change.</small>")},
prog(){const g=grade();return H("Progress by unit","Objective 6 · Progress dashboard")+`<div class="grid"><div class="card stat"><b>${pct()}%</b>All tasks completed</div><div class="card stat"><b>${g.avg}%</b>Average mark so far</div><div class="card stat"><b>${g.need}%</b>Needed on remaining work to finish on 70%</div></div><div class="grid">${S.units.map((u,i)=>{const s=ust(i);return `<div class="card"><b>${u[0]}</b> <small>${u[1]}</small><p>Tasks done: ${s.d} of ${s.n}</p><div class="bar"><i style="width:${s.p}%"></i></div><p>Quiz average: ${s.qa===null?"none yet":s.qa+"%"}<br>Marks so far: ${s.m===null?"none yet":s.m+"%"}</p></div>`}).join("")}</div>`},
cls(){const sb=[72,64,58],qa=[68,71,66],ar=[5,4,3];return H("Class progress by unit","Objective 6 · Student progress for instructors")+`<div class="grid">${S.units.map((u,i)=>`<div class="card"><b>${u[0]}</b> <small>${u[1]}</small><p>${stu(i)} students<br>Assignments submitted: ${sb[i]}%</p><div class="bar"><i style="width:${sb[i]}%"></i></div><p>Quiz average: ${qa[i]}%<br><span class="hi">${ar[i]} students need support</span></p></div>`).join("")}</div><b>Students needing support</b>`+tbl(["Student","Unit","Tasks done","Quiz average"],[["Faith Njeri","CSC 311","17%","45%"],["Peter Kamau","CSC 325","25%","50%"],["Mercy Achieng","CSC 429","20%","48%"]])},
msgs(){const st=S.role=="Student";return H("Messages and announcements","Objective 5 · Announcements and messages")+`<div class="card">${S.msgs.map(m=>`<div class="item"><div>${m.t}<br><small>${m.f} · ${U(m.c)}</small></div></div>`).join("")}</div><div class="card"><div class="row"><select id="mu">${S.units.map((u,i)=>`<option value=${i}>${u[0]}</option>`).join("")}</select><input id="mt" placeholder="${st?"Message your instructor":"Write an announcement"}" style="flex:1"><button onclick="S.msgs.unshift({f:S.user.name,t:$('#mt').value||'(empty)',c:+$('#mu').value});R();toast('${st?"Message sent":"Students notified"}')">${st?"Send":"Post"}</button></div></div>`},
usr(){return H("Users and units","Objective 1 · Accounts and role-based access")+`<div class="card"><div class="row"><input id="un" placeholder="Full name"><select id="ur"><option>Student</option><option>Instructor</option></select><button onclick="const r=$('#ur').value;S.users.push([$('#un').value||'New user',r]);if(r=='Student')S.extra++;R();toast('User added')">Add user</button></div><table><tr><th>Name</th><th>Role</th></tr>${S.users.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td></tr>`).join("")}</table><small>Showing recent users. ${total()} students in total.</small></div><b>Students per unit</b>`+tbl(["Unit","Instructor","Students"],S.units.map((u,i)=>[U(i),"Grace Mwangi",stu(i)]))},
rep(){const r={Student:[["Unit","Tasks done","Quiz average","Marks so far"],S.units.map((u,i)=>{const s=ust(i);return[U(i),s.d+" of "+s.n,s.qa===null?"-":s.qa+"%",s.m===null?"-":s.m+"%"]})],Instructor:[["Unit","Students","Assignments submitted","Quiz average"],S.units.map((u,i)=>[U(i),stu(i),[72,64,58][i]+"%",[68,71,66][i]+"%"])],Administrator:[["Unit","Students","Resources","Quizzes"],S.units.map((u,i)=>[U(i),stu(i),ofU(S.res,i).length,ofU(S.quizzes,i).length]).concat([["Overall",total(),S.res.length,S.quizzes.length]])]}[S.role];
return H("Reports","Objective 6 · Report generation")+`<div class="row"><select><option>${S.role=="Student"?"Progress summary":S.role=="Instructor"?"Class summary":"System summary"} by unit</option><option>Last 7 days</option></select><button onclick="toast('Report generated (PDF and CSV export in the full system)')">Generate report</button></div>`+tbl(r[0],r[1])}};
function addTask(){const t=$("#nt").value,d=$("#nd").value;if(!t||!d)return toast("Enter a task and due date");S.tasks.push({t,c:+$("#nc").value,d:Math.max(0,Math.ceil((new Date(d)-new Date())/864e5)),w:+$("#nw").value||5,h:3,done:0});S.plan=null;R();toast("Task added; reminder scheduled")}
function addAsg(i){const t=$("#at").value,d=$("#ad").value;if(!t||!d)return toast("Enter a title and due date");S.tasks.push({t,c:i,d:Math.max(0,Math.ceil((new Date(d)-new Date())/864e5)),w:+$("#aw").value||5,h:3,done:0,a:1});R();toast("Assignment created; students notified")}
function submitA(k){const f=$("#f"+k).value.trim();if(!f)return toast("Add a file name first");Object.assign(S.tasks[k],{done:1,sub:f});S.plan=null;R();toast("Assignment submitted")}
function addQuiz(i){const t=$("#qt").value,q=$("#qq").value,a=$("#qa").value,w=$("#qw").value;if(!t||!q||!a||!w)return toast("Fill in all quiz fields");S.quizzes.push({c:i,t,qs:[{q,o:[w,a],a:1}]});R();toast("Quiz published to students")}
function ans(j){const s=S.qs,q=S.quizzes[S.qi];s.ans.push(j);if(++s.i>=q.qs.length){s.fin=true;(S.sc[q.c]=S.sc[q.c]||[]).push(Math.round(s.ans.filter((a,x)=>a==q.qs[x].a).length/q.qs.length*100))}R()}
function newTh(i){const t=$("#dt").value;if(!t)return toast("Enter a title");S.th.unshift({t,c:i,by:S.user.name,ans:0,p:[[S.user.name,t]]});R();toast("Discussion posted")}
function authView(){const l=S.mode=="login";return `<div class="auth"><div class="logo">🎓</div><h1>University StudyHub</h1><small style="display:block;text-align:center">Study resources and academic planning in one place</small><div style="text-align:center;margin-top:8px"><span class="obj">Objective 1 · Accounts and role-based access</span></div><div class="tabs"><button class="${l?"":"ghost"}" onclick="setMode('login')">Log in</button><button class="${l?"ghost":""}" onclick="setMode('signup')">Sign up</button></div><div class="card">`+(l?`<label class="fld"><span>Email</span><input id="e" type="email" placeholder="you@university.ac.ke" autocomplete="username"></label><label class="fld"><span>Password</span><input id="p" type="password" autocomplete="current-password"></label><div class="err">${S.err}</div><button style="width:100%" onclick="doLogin()">Log in</button><p><button class="link" onclick="toast('A reset link would be emailed to you')">Forgot password?</button></p><small>Demo accounts (tap to fill in):</small><div class="demo"><button class="ghost" onclick="fill('student@university.ac.ke','student123')">Student</button><button class="ghost" onclick="fill('instructor@university.ac.ke','instructor123')">Instructor</button><button class="ghost" onclick="fill('admin@university.ac.ke','admin123')">Administrator</button></div>`:`<label class="fld"><span>Full name</span><input id="n" autocomplete="name"></label><label class="fld"><span>Email</span><input id="e" type="email" placeholder="you@university.ac.ke" autocomplete="username"></label><label class="fld"><span>I am a</span><select id="r"><option>Student</option><option>Instructor</option></select></label><label class="fld"><span>Password (6+ characters)</span><input id="p" type="password" autocomplete="new-password"></label><label class="fld"><span>Confirm password</span><input id="p2" type="password" autocomplete="new-password"></label><div class="err">${S.err}</div><button style="width:100%" onclick="doSignup()">Create account</button>`)+`</div></div><div id="toast"></div>`}
const setMode=m=>{S.mode=m;S.err="";R()},fill=(e,p)=>{S.mode="login";S.err="";R();$("#e").value=e;$("#p").value=p};
function err(m){const v={e:$("#e").value,n:$("#n")?$("#n").value:"",r:$("#r")?$("#r").value:""};S.err=m;R();["e","n","r"].forEach(k=>{if(v[k]&&$("#"+k))$("#"+k).value=v[k]})}
function start(a){S.user={name:a.n,email:a.e};S.role=a.r;S.view="dash";S.unit=null;S.ot=null;S.qi=null;S.err="";R();toast("Welcome, "+a.n.split(" ")[0])}
function doLogin(){const e=$("#e").value.trim().toLowerCase(),p=$("#p").value;if(!e||!p)return err("Enter your email and password.");const a=S.acc.find(x=>x.e==e&&x.p==p);if(!a)return err("Incorrect email or password.");start(a)}
function doSignup(){const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase(),p=$("#p").value,p2=$("#p2").value,r=$("#r").value;let m="";if(!n||!e||!p)m="Fill in all fields.";else if(!/^\S+@\S+\.\S+$/.test(e))m="Enter a valid email address.";else if(S.acc.some(x=>x.e==e))m="An account with this email already exists.";else if(p.length<6)m="Password must be at least 6 characters.";else if(p!=p2)m="Passwords do not match.";if(m)return err(m);const a={e,p,n,r};S.acc.push(a);S.users.push([n,r]);if(r=="Student")S.extra++;start(a)}
function logout(){S.user=null;S.mode="login";S.err="";R();toast("You have been logged out")}
function R(){if(!S.user){$("#app").innerHTML=authView();return}$("#app").innerHTML=`<header><b>🎓 University StudyHub</b><span class="sp"></span><span>${S.user.name} · ${S.role}</span><button class="ghost" onclick="logout()">Log out</button></header><div class="app"><nav>${NAV[S.role].map(([k,l])=>`<a class="${k==S.view?"on":""}" onclick="S.view='${k}';S.unit=null;S.ot=null;S.qi=null;R()">${l}</a>`).join("")}</nav><main>${V[S.view]()}<p><small>Prototype with sample data. Log in with a different demo account to see role-based access.</small></p></main></div><div id="toast"></div>`}
R();
</script></body></html>
