<title>University StudyHub – Complete LMS Prototype</title>
<style>
:root{--bg:#f7f4f4;--card:#fff;--ink:#241a1a;--mut:#6b5d5d;--pri:#a81c1c;--tint:#fbeaea;--line:#e6dcdc;--ok:#2e7d32;--warn:#b26a00;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0f;--card:#211817;--ink:#f3eae9;--mut:#b9a9a7;--pri:#c93a3a;--tint:#2e1a1a;--line:#3a2b2a;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f0f;--card:#211817;--ink:#f3eae9;--mut:#b9a9a7;--pri:#c93a3a;--tint:#2e1a1a;--line:#3a2b2a;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--pri);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px}
header .sp{flex:1;min-width:12px}
header input.gsearch{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);min-height:36px;padding:4px 12px;border-radius:99px;width:230px;font-size:13px}
header input.gsearch::placeholder{color:rgba(255,255,255,.8)}
header button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);min-height:36px;padding:5px 11px;font-size:13px;position:relative}
header button:hover{background:rgba(255,255,255,.26)}
.badge{position:absolute;top:-5px;right:-5px;background:#fff;color:var(--pri);font-size:11px;font-weight:700;padding:1px 5px;border-radius:99px}
.pop{position:fixed;top:58px;right:16px;width:min(380px,calc(100vw - 32px));max-height:75vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px;z-index:25}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;padding:18px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px)}
nav{background:var(--card);border-right:1px solid var(--line);padding:12px 8px}
nav a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink);margin-bottom:2px;font-size:14px}
nav a.on{background:var(--tint);color:var(--pri);font-weight:600}
main{padding:20px;max-width:980px;width:100%}
h2{margin:0 0 4px;font-size:22px}.obj{display:inline-block;font-size:12px;background:var(--tint);color:var(--pri);padding:2px 8px;border-radius:99px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.alert{background:var(--tint);border:1px solid var(--pri);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}.grid .card{margin:0}
.unit{cursor:pointer}.unit:hover,.unit.sel{border-color:var(--pri);background:var(--tint)}
.unit b{font-size:16px}.tiles b{font-size:22px;color:var(--pri)}
.stat b{display:block;font-size:24px;color:var(--pri)}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;min-height:42px}
button.ghost{background:var(--tint);color:var(--pri)}
button.sm{padding:6px 12px;min-height:34px;font-size:13px}
button.pill{border-radius:99px;padding:6px 14px;min-height:34px;font-size:13px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:42px;max-width:100%}
input[type="file"]{padding:6px;font-size:13px}
input[type="range"]{padding:0;min-height:24px;accent-color:var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--tint);color:var(--pri);display:inline-flex;align-items:center;gap:6px}
.tag button{background:none;color:var(--pri);padding:0 2px;min-height:0;font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.hi{color:var(--pri);font-weight:600}.med{color:var(--warn);font-weight:600}.lo{color:var(--ok);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.bar.sm{height:6px;width:110px;display:inline-block;vertical-align:middle;margin-right:6px}
.funnel-row{display:grid;grid-template-columns:150px 1fr 150px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.funnel-row:last-child{border:0}
.week-banner{display:flex;align-items:center;justify-content:space-between;background:var(--tint);border-left:4px solid var(--pri);padding:8px 12px;border-radius:8px;margin:16px 0 8px}
.topic-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
.topic-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.topic-col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.topic-col h5{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--pri);display:flex;justify-content:space-between;align-items:center}
.mini-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini-item:last-child{border:0}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt-table th,.tt-table td{white-space:normal;vertical-align:top;min-width:132px;border-right:1px solid var(--line)}
.tt-table th:first-child,.tt-table td:first-child{min-width:125px;background:var(--bg);font-weight:600;position:sticky;left:0;z-index:2}
.tt-table th:last-child,.tt-table td:last-child{border-right:0}
.tt-slot{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:8px;padding:7px 8px;margin-bottom:6px;font-size:12.5px;line-height:1.35}
.tt-slot:last-child{margin-bottom:0}
.tt-slot.quiz{border-left-color:var(--warn)}
.tt-slot.study{border-left-color:var(--ok)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.done{text-decoration:line-through;color:var(--mut)}
.fb{background:var(--bg);border-left:3px solid var(--pri);padding:8px 10px;border-radius:6px;margin-top:6px;font-size:13px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px}
.opt:hover{border-color:var(--pri);background:var(--tint)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--tint);color:var(--pri)}
.timer.urgent{background:var(--pri);color:#fff}
.flashcard{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:2px solid var(--pri);border-radius:14px;background:var(--tint);cursor:pointer;margin:12px 0;transition:transform .15s}
.flashcard:hover{transform:translateY(-2px)}
.pomo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border:1px solid var(--pri);border-radius:12px;padding:14px;margin-bottom:12px}
.pomo-clock{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri)}
.report-sheet{background:var(--card);border:2px solid var(--pri);border-radius:14px;padding:22px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.report-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--pri);padding-bottom:12px;margin-bottom:16px}
.report-sec{margin-top:18px}
.report-sec h4{margin:0 0 8px;color:var(--pri);font-size:15px;text-transform:uppercase;letter-spacing:.4px}
.auth{max-width:420px;margin:0 auto;padding:28px 16px}.auth .logo{text-align:center;font-size:44px}.auth h1{text-align:center;margin:4px 0 2px;font-size:24px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}.fld input,.fld select{width:100%}
.err{color:var(--pri);font-size:13px;min-height:18px;margin-bottom:8px}.link{color:var(--pri);background:none;border:0;padding:0;min-height:0;font-size:13px;text-decoration:underline}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.demo button{padding:6px 10px;min-height:36px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:40}
small{color:var(--mut)}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:8}nav a{white-space:nowrap;margin:0 4px 0 0}main{padding:14px}header input.gsearch{width:100%;order:10}.funnel-row{grid-template-columns:1fr}}
@media print{
  body{background:#fff !important;color:#000 !important}
  body::before,header,nav,.no-print,#toast,.pop,.modal-bg,main > p:last-child{display:none !important}
  .app{display:block !important}
  main{max-width:100% !important;padding:0 !important}
  .report-sheet{border:1px solid #999 !important;box-shadow:none !important;padding:12px !important;margin:0 !important}
  .card{border:1px solid #ccc !important;break-inside:avoid}
  table{display:table !important;width:100% !important}
  th,td{white-space:normal !important;font-size:12px !important;padding:6px !important}
}
</style></head>

function computeGhostCourses(){
  return S.units.map((u,i)=>{
    const insAcc=S.acc.find(a=>a.n===u.ins&&a.r==="Instructor");
    const lastLoginDays=insAcc?.lastLoginDays??15;
    const resCount=ofU(S.res,i).length;
    const msgCount=S.msgs.filter(m=>m.c===i&&m.f===u.ins).length;
    const asgCount=S.tasks.filter(t=>t.a&&t.c===i).length;
    const isGhost=lastLoginDays>=14 || (resCount===0 && msgCount===0);
    const isLow=!isGhost && (lastLoginDays>=7 || resCount<2 || msgCount===0);
    return{
      unitIdx:i,code:u.code,name:u.name,ins:u.ins,students:u.students.length,
      lastLoginDays,resCount,msgCount,asgCount,
      status:isGhost?"Ghost Course":isLow?"Low Activity":"Active",
      severity:isGhost?"hi":isLow?"med":"lo"
    };
  });
}

function computeSilentDisengagement(){
  return allStudents().map(st=>{
    const days=st.lastLoginDays??0;
    const enrolled=S.units.filter(u=>u.students.includes(st.n));
    const subCount=S.tasks.filter(t=>t.a&&(t.subs||{})[st.n]).length;
    const quizCount=S.quizzes.filter(q=>(q.attempts||{})[st.n]?.length).length;
    const status=days>=14?"Dormant (14d+ Zero Login)":days>=7?"Slipping (7–13d Inactive)":"Active";
    return{
      name:st.n,email:st.e,year:st.year||3,days,feeStatus:st.feeStatus||"Cleared",
      enrolledCount:enrolled.length,subCount,quizCount,status,
      severity:days>=14?"hi":days>=7?"med":"lo"
    };
  }).sort((a,b)=>b.days-a.days);
}

function computeCohortFunnel(){
  return S.cohorts.map((c,idx)=>{
    const retentionPct=c.enrolled?Math.round(c.retained/c.enrolled*100):100;
    const lost=c.transfersOut+c.dropouts;
    const attritionPct=c.enrolled?Math.round(lost/c.enrolled*1000)/10:0;
    return{...c,idx,retentionPct,lost,attritionPct};
  });
}

const taskForMe=t=>{
  const lh=loggedHours(t), est=t.h||1;
  if(!t.a)return{done:!!t.done,mark:t.m??null,sub:null,fb:"",status:t.done?"Done":"Pending",lh,est};
  const s=(t.subs||{})[S.user.name];
  if(!s)return{done:false,mark:null,sub:null,fb:"",status:"Pending",lh,est};

};

const studentAttendancePct=(stName,unitIdx)=>{
  const sessions=S.attendance.filter(a=>a.c===unitIdx && a.records[stName]);
  if(!sessions.length)return 100;
  const present=sessions.filter(a=>a.records[stName]==="Present"||a.records[stName]==="Late").length;
  return Math.round(present/sessions.length*100);
};

const computeAtRiskStudents=()=>{
  const mine=myUnitIndices(), alerts=[];
  mine.forEach(i=>{
    const u=S.units[i], unitAsgs=S.tasks.filter(t=>t.a&&t.c===i), unitQuizzes=ofU(S.quizzes,i);
    u.students.forEach(stName=>{
      const attPct=studentAttendancePct(stName,i);
      const qScores=unitQuizzes.flatMap(q=>(q.attempts?.[stName]||[]).map(a=>a.score));
      const qAvg=qScores.length?Math.round(qScores.reduce((a,b)=>a+b,0)/qScores.length):null;
      const missingAsgs=unitAsgs.filter(t=>!(t.subs||{})[stName]).length;
      const reasons=[];
      if(attPct<75)reasons.push(`Low attendance (${attPct}%)`);
      if(qAvg!==null && qAvg<50)reasons.push(`Quiz avg ${qAvg}%`);
      if(missingAsgs>0)reasons.push(`${missingAsgs} unsubmitted assignment${missingAsgs>1?"s":""}`);
      if(reasons.length)alerts.push({student:stName,unit:`${u.code} ${u.name}`,attPct,qAvg:qAvg===null?"—":qAvg+"%",reasons:reasons.join(" · ")});
    });
  });
  return alerts;
};

function computePlan(silent=false){
  const T=pend().map((t)=>({idx:S.tasks.indexOf(t),t,left:remHours(t)})).filter(x=>x.left>0);
  const days=[...Array(7)].map((_,i)=>{
    const dow=(D(i).getDay()+6)%7;
    const lecHrs=lectureHoursForDay(dow);
    const netFree=netFreeHoursForDay(dow);
    return{d:D(i),dow,lecHrs,free:netFree,it:[]};
  });
  const warnings=[];
  T.forEach(item=>{
    const maxDay=Math.min(6,Math.max(0,item.t.d));
    if(item.t.d<0)warnings.push(`"${item.t.t}" (${U(item.t.c)}) is already overdue by ${Math.abs(item.t.d)} day(s) with ${item.left}h left.`);
    days.forEach((day,i)=>{
      if(item.left>0&&day.free>0&&i<=maxDay){
        const u=Math.min(item.left,day.free);
        day.it.push({idx:item.idx,hours:u});day.free-=u;item.left-=u;
      }
    });
    if(item.left>0)warnings.push(`Schedule shortfall: ${item.left}h unscheduled for "${item.t.t}" before its due date (${fd(D(item.t.d))}) after deducting lecture hours.`);
  });
  S.plan={days,warnings};
  R();
  if(!silent)toast(warnings.length?"Plan generated with schedule warnings":"Study plan generated around your class timetable");
}

function logStudyHour(taskIdx,amt=1){
  const t=S.tasks[taskIdx];
  if(!t)return;
  t.logged=t.logged||{};
  t.logged[S.user.name]=Math.round(((t.logged[S.user.name]||0)+amt)*10)/10;
  const est=t.h||1;
  if(!t.a && t.logged[S.user.name]>=est && !t.done){
    t.done=1;
    toast(`Logged ${amt}h — "${t.t}" reached ${est}h and is marked complete!`);
  }else toast(`Logged ${amt}h on "${t.t}" (${t.logged[S.user.name]}/${est}h)`);
  if(S.plan)computePlan(true);else R();
}

// Weekly Topic Modules View (Weeks -> Topics -> Slides/Resources, Quizzes, Discussions)
function addTopicModule(unitIdx){
  const week=Math.max(1,Math.min(16,+$("#tp_week").value||1));
  const title=$("#tp_title").value.trim();
  const summary=$("#tp_sum").value.trim()||"Weekly topic learning materials and assessments.";
  if(!title)return toast("Enter a topic title");
  S.topics.push({id:"tp_"+Date.now(),c:unitIdx,week,title,summary});
  R();toast(`Added Topic "${title}" to Week ${week}`);
}

function quickTopicDiscussion(unitIdx,topicId){
  const input=$("#qdisc_"+topicId);
  const title=input?.value.trim();
  if(!title)return toast("Enter a discussion question or prompt");
  S.th.unshift({t:title,c:unitIdx,topicId,by:S.user.name,ans:0,p:[[S.user.name,title]]});
  R();toast("Discussion started under topic");
}

function addResource(i){
  const t=$("#ut").value.trim(), k=$("#uk").value, topicId=$("#utopic").value||null, x=$("#ux").value.trim()||"Uploaded resource";
  const fileInput=$("#ufile");
  const f=fileInput?.files?.[0];
  if(!t && !f)return toast("Enter a title or pick a file to upload");
  const finalTitle=t||f.name;
  let blobKey=null, fileName=finalTitle.toLowerCase().replace(/\s+/g,"_")+".pdf";
  if(f){
    blobKey="res_"+Date.now();
    FILE_BLOBS[blobKey]={url:URL.createObjectURL(f),type:f.type||"application/octet-stream",name:f.name};
    fileName=f.name;
  }
  S.res.unshift({t:finalTitle,c:i,topicId,k,x,views:1,file:fileName,blobKey,summary:`Uploaded by ${S.user.name} (${x}).`});
  S.resCat=k;R();
  toast(`Published "${finalTitle}" to ${k}`);
}

};

function renderCohortFunnelCard(isReport=false){
  const funnel=computeCohortFunnel();
  const worst=funnel.reduce((a,b)=>b.attritionPct>a.attritionPct?b:a,funnel[0]);
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div><b>📈 Cohort Progression & Transfer Funnel (Year 1 → Year 4)</b><br><small>Highest attrition bottleneck: <span class="hi">${esc(worst.year)} (${worst.attritionPct}% lost · ${worst.transfersOut} transfers, ${worst.dropouts} dropouts)</span></small></div>
      <span class="tag">Overall Y1→Y4 Survival: ${Math.round(funnel[3].retained/funnel[0].enrolled*100)}%</span>
    </div>
    ${funnel.map(c=>`<div class="funnel-row">
      <div><b>${esc(c.year)}</b><br><small>Mean GPA: ${c.gpa}%</small></div>
      <div>
        <div class="bar"><i style="width:${c.retentionPct}%"></i></div>
        <small>${c.retained} retained of ${c.enrolled} · ${c.transfersOut} transfers out · ${c.dropouts} dropouts</small>
      </div>
      <div style="text-align:right"><b class="${c.retentionPct>=90?"lo":c.retentionPct>=85?"med":"hi"}">${c.retentionPct}% Retained</b><br><small>-${c.attritionPct}% attrition</small></div>
    </div>`).join("")}
  </div>`;
}

function renderGhostCoursesTable(isReport=false){
  const list=computeGhostCourses();

  const rows=list.map(g=>{
    const base=[
      `${esc(g.code)} ${esc(g.name)}`,
      esc(g.ins),
      `${g.students}`,
      g.lastLoginDays===0?"Today":`${g.lastLoginDays}d ago`,
      `${g.resCount}`,

function renderIntegrityTable(isReport=false){
  const headers=isReport?["Case ID","Student","Unit","Flag Type","Evidence Summary","Severity","Status"]:["Case ID","Student","Unit","Flag Type","Evidence Summary","Severity","Status","Action"];

      `<b>${esc(f.id)}</b>`,
      esc(f.student),
      esc(f.unit),

function buildRoleReport(){
  const mine=myUnitIndices();
  const dateStr=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});

  if(S.role==="Student"){
    const g=grade();
    const avgAtt=mine.length?Math.round(mine.reduce((a,i)=>a+studentAttendancePct(S.user.name,i),0)/mine.length):100;
    const totalLogged=myTasks().reduce((a,t)=>a+loggedHours(t),0);
    const hrsLeft=pend().reduce((a,t)=>a+remHours(t),0);
    const weeklyNet=DAYS.reduce((a,_,d)=>a+netFreeHoursForDay(d),0);
    const unmastered=S.flashcards.filter(c=>mine.includes(c.c)&&!c.mastered?.[S.user.name]);
    const weakTopics=[...new Set(unmastered.map(c=>`${S.units[c.c]?.code}: ${c.front}`))];
    const unitRows=mine.map(i=>{
      const s=ust(i), att=studentAttendancePct(S.user.name,i);
      const uLogged=ofU(S.tasks,i).reduce((a,t)=>a+loggedHours(t),0);
      const safeMisses=Math.max(0,Math.floor((att-75)/10));
      const readiness=s.m!==null?(s.m>=70?"Strong ":s.m>=60?"On Track (2nd Upper)":"Needs Revision"):(s.qa!==null&&s.qa>=60?"On Track":"Pending Assessment");
      return [U(i),`${att}% (${safeMisses} skip warnings)`,`${s.d}/${s.n} (${s.p}%)`,`${uLogged}h logged`,s.qa===null?"—":s.qa+"%",s.m===null?"—":s.m+"%",readiness];
    });
    const csvRows=[["Unit","Attendance & Buffer","Task Completion","Study Effort","Quiz Avg","Coursework Avg","Next-Semester Readiness"],...unitRows];
    const html=`
      <div class="report-head">
        <div><b style="font-size:20px">🎓 Student Academic & Forward-Planning Report</b><br><small>Student: <b>${esc(S.user.name)}</b> (${esc(S.user.email)}) · Generated ${dateStr}</small></div>
        <span class="tag">Target: First Class (70%+)</span>
      </div>
      <div class="grid">
        <div class="card stat"><b>${g.avg}%</b>Current Weighted Avg</div>
        <div class="card stat"><b>${g.need}%</b>Required on Remaining Work</div>
        <div class="card stat"><b>${avgAtt}%</b>Overall Attendance</div>
        <div class="card stat"><b>${hrsLeft}h / ${weeklyNet}h</b>Workload vs. Net Free Hrs</div>
      </div>
      <div class="report-sec">
        <h4>1. Unit-by-Unit Performance, Attendance Safety Margin & Readiness</h4>
        ${tbl(["Unit","Attendance & Skip warnings","Tasks Done","Study Effort","Quiz Avg","Marks So Far","Readiness level"],unitRows.map(r=>r.map(esc)))}
      </div>
      <div class="report-sec">
        <h4>2. Revision Focus & Weakest Concept Heatmap</h4>
        <div class="card">
          <p style="margin:0 0 6px"><b>Concepts Flagged for Revision (${weakTopics.length} unmastered flashcards):</b></p>
          ${weakTopics.length?`<ul style="margin:0;padding-left:18px">${weakTopics.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:`<small>All unit flashcards mastered!</small>`}
          <p style="margin:10px 0 0"><small><b>Portfolio & Study ROI:</b> ${totalLogged}h total study logged across ${mine.length} active units (${pct()}% completion rate).</small></p>
        </div>
      </div>`;
    return{title:"Student Academic & Forward-Planning Report",csv:csvRows,html};
  }

  if(S.role==="Instructor"){
    const riskList=computeAtRiskStudents();
    const ungraded=ungradedCount();
    const openThreads=S.th.filter(t=>mine.includes(t.c)&&!t.ans).length;
    const unitRows=mine.map(i=>{
      const u=S.units[i], asgs=S.tasks.filter(t=>t.a&&t.c===i), tot=asgs.length*stu(i);
      const sub=asgs.reduce((a,t)=>a+Object.keys(t.subs||{}).length,0);
      const subPct=tot?Math.round(sub/tot*100):0;
      const allScores=ofU(S.quizzes,i).flatMap(q=>Object.values(q.attempts||{}).flat().map(a=>a.score));
      const qAvg=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length)+"%":"—";
      const avgUnitAtt=u.students.length?Math.round(u.students.reduce((a,st)=>a+studentAttendancePct(st,i),0)/u.students.length):100;
      const topRes=ofU(S.res,i).sort((a,b)=>(b.views||0)-(a.views||0))[0];
      const uRisks=riskList.filter(r=>r.unit.startsWith(u.code)).length;
      return [U(i),`${stu(i)} students`,`${avgUnitAtt}%`,`${subPct}%`,qAvg,topRes?`${topRes.t} (${topRes.views||0} views)`:"—",`${uRisks} flagged`];
    });
    const csvRows=[["Unit","Cohort Size","Mean Attendance","Submission Rate","Quiz Mean","Most Used Resource","At-Risk Count"],...unitRows];
    const html=`
      <div class="report-head">
        <div><b style="font-size:20px">📋 Instructor Teaching Analytics & Intervention Report</b><br><small>Lecturer: <b>${esc(S.user.name)}</b> · Generated ${dateStr}</small></div>
        <span class="tag">${mine.length} Assigned Units</span>
      </div>
      <div class="grid">
        <div class="card stat"><b>${riskList.length}</b>At-Risk Students Flagged</div>
        <div class="card stat"><b>${ungraded}</b>Scripts Awaiting Grading</div>
        <div class="card stat"><b>${openThreads}</b>Unanswered Forum Threads</div>
        <div class="card stat"><b>${mine.reduce((a,i)=>a+stu(i),0)}</b>Total Student Seats</div>
      </div>
      <div class="report-sec">
        <h4>1. Unit Engagement, Resource Utilization & Assessment Summary</h4>
        ${tbl(["Unit","Cohort","Mean Attendance","Submissions","Quiz Avg","Top Accessed Resource","At-Risk Alerts"],unitRows.map(r=>r.map(esc)))}
      </div>
      <div class="report-sec">
        <h4>2. Priority Early-Alert Intervention & Exam Eligibility Defaulter Roster</h4>
        ${riskList.length?tbl(["Student","Unit","Attendance","Quiz Avg","Action Required"],riskList.map(r=>[esc(r.student),esc(r.unit),`<span class="${r.attPct<75?"hi":"lo"}">${r.attPct}%</span>`,esc(r.qAvg),`<span class="hi">${esc(r.reasons)}</span>`])):`<div class="card"><small>All students currently meet attendance and coursework thresholds.</small></div>`}
      </div>`;
    return{title:"Instructor Teaching Analytics & Intervention Report",csv:csvRows,html};
  }

  const ghosts=computeGhostCourses().filter(g=>g.status==="Ghost Course");
  const dormant=computeSilentDisengagement().filter(s=>s.days>=14);
  const openFlags=S.integrityFlags.filter(f=>f.status!=="Cleared");
  const csvRows=[
    ["Section","Item","Metric / Detail","Status"],
    ...computeCohortFunnel().map(c=>["Cohort Progression",c.year,`Retained: ${c.retained}/${c.enrolled} (${c.retentionPct}%) | Transfers: ${c.transfersOut} | Dropouts: ${c.dropouts}`,`-${c.attritionPct}% attrition`]),
    ...computeGhostCourses().map(g=>["Ghost Course Detector",`${g.code} (${g.ins})`,`Last login: ${g.lastLoginDays}d ago | ${g.resCount} resources`,g.status]),
    ...computeSilentDisengagement().map(s=>["Silent Disengagement",s.name,`Last login: ${s.days}d ago | SIS: ${s.feeStatus} | ${s.subCount} submissions`,s.status]),
    ...S.integrityFlags.map(f=>["Academic Integrity",`${f.id}: ${f.student} (${f.unit})`,f.type,f.status])
  ];
  const html=`
    <div class="report-head">
      <div><b style="font-size:20px">🏛️ Institutional Governance, Retention & Quality Assurance Report</b><br><small>Prepared by: <b>${esc(S.user.name)}</b> · Generated ${dateStr}</small></div>
      <span class="tag">Senate & CUE Audit Ready</span>
    </div>
    <div class="grid">
      <div class="card stat"><b>${ghosts.length}</b>Ghost Courses (14d+ Inactive)</div>
      <div class="card stat"><b>${dormant.length}</b>Dormant Students (14d+ Zero Login)</div>
      <div class="card stat"><b>${openFlags.length}</b>Open Integrity Flags</div>
      <div class="card stat"><b>${Math.round(S.cohorts[3].retained/S.cohorts[0].enrolled*100)}%</b>Y1 → Y4 Cohort Progression</div>
    </div>
    <div class="report-sec">
      <h4>1. Cohort Progression & Transfer Funnel (Year 1 → Year 4)</h4>
      ${renderCohortFunnelCard(true)}
    </div>
    <div class="report-sec">
      <h4>2. Lecturer Activity & "Ghost Course" Detector</h4>
      ${renderGhostCoursesTable(true)}
    </div>
    <div class="report-sec">
      <h4>3. Silent Disengagement / Zero-Login Early Alert</h4>
      ${renderSilentDisengagementTable(true)}
    </div>
    <div class="report-sec">
      <h4>4. Academic Integrity & Plagiarism Flag Log</h4>
      ${renderIntegrityTable(true)}
    </div>`;
  return{title:"Institutional Governance, Retention & Quality Assurance Report",csv:csvRows,html};
}

function downloadCSV(){
  const rep=buildRoleReport();
  const csv=rep.csv.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`studyhub_${S.role.toLowerCase()}_governance_report.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV report downloaded");
}

function printReport(){
  S.repPreview=true;R();
  setTimeout(()=>window.print(),120);
}

const V={
  dash(){
    const n=pend().slice(0,3),a=S.msgs[0],mine=myUnitIndices();
    const todayName=DAYS[(new Date().getDay()+6)%7];
    const todayClasses=S.timetable.filter(s=>s.day===todayName && mine.includes(s.c));

    if(S.role=="Instructor"){
      const myStu=new Set(mine.flatMap(i=>S.units[i].students)).size, toMark=ungradedCount(), atRisk=computeAtRiskStudents().length;
      return H("Instructor dashboard","Objectives 1, 5 and 6")+`<div class="grid"><div class="card stat"><b>${mine.length}</b>Units assigned</div><div class="card stat"><b>${myStu}</b>Unique students</div><div class="card stat"><b>${toMark}</b>Assignments to mark</div><div class="card stat"><b>${atRisk}</b>At-risk alerts</div></div><div class="card"><b>Latest announcement</b><p>${esc(a.t)}</p></div><button onclick="S.view='res';R()">Open my units (Weeks & Topics)</button> <button class="ghost" onclick="S.view='rep';R()">Preview & print report</button>`;
    }
    if(S.role=="Administrator"){
      const ghosts=computeGhostCourses().filter(g=>g.status==="Ghost Course").length;
      const dormant=computeSilentDisengagement().filter(s=>s.days>=14).length;
      const openFlags=S.integrityFlags.filter(f=>f.status!=="Cleared").length;
      return H("Administrator Executive Dashboard","Institutional Governance, Retention & Compliance")+
      `<div class="grid">
        <div class="card stat"><b>${ghosts}</b>Ghost Courses Flagged</div>
        <div class="card stat"><b>${dormant}</b>Dormant Students (14d+)</div>
        <div class="card stat"><b>${openFlags}</b>Open Integrity Flags</div>
        <div class="card stat"><b>${Math.round(S.cohorts[3].retained/S.cohorts[0].enrolled*100)}%</b>Y1→Y4 Cohort Survival</div>
      </div>`+
      renderCohortFunnelCard(false)+
      `<div class="row">
        <button onclick="S.view='gov';R()">Open Governance & Early-Alert Center</button>
        <button class="ghost" onclick="S.view='usr';R()">Manage users & units</button>
        <button class="ghost" onclick="S.view='rep';R()">Preview & print institutional report</button>
      </div>`;
    }
    const hrsLeft=pend().reduce((acc,t)=>acc+remHours(t),0);
    return H("Welcome back, "+esc(S.user.name.split(" ")[0]),"")+
    `<div class="grid"><div class="card stat"><b>${pend().length}</b>Tasks pending (${hrsLeft}h left)</div><div class="card stat"><b>${pct()}%</b>Tasks completed</div><div class="card stat"><b>${grade().avg}%</b>Average mark so far</div></div>`+
    `<div class="card"><b>Today's Timetable (${todayName})</b>${todayClasses.length?todayClasses.map(s=>`<div class="item"><div><b>${esc(U(s.c))}</b><br><small>${esc(s.venue)} · ${esc(s.type)}</small></div><span class="tag">${esc(s.time)}</span></div>`).join(""):"<p><small>No scheduled lectures today — full study capacity available.</small></p>"}</div>`+
    `<div class="card"><b>Next deadlines</b>${n.map(t=>`<div class="item"><div>${esc(t.t)}<br><small>${esc(U(t.c))} · due ${fd(D(t.d))} · ${loggedHours(t)}/${t.h||1}h studied</small></div><span class="${pr(t)[1][1]}">${pr(t)[1][0]}</span></div>`).join("")||"<small>No pending deadlines.</small>"}</div>`+
    `<div class="card"><b>Announcement</b><p>${esc(a.t)}</p><small>${esc(a.f)}</small></div>`+
    `<button onclick="S.view='res';R()">Open my units (Weeks & Topics)</button> <button class="ghost" onclick="S.view='plan';R()">Study planner & Focus</button>`;
  },
  gov(){
    return H("Institutional Governance & Early-Alert Center","Cohort Progression · Ghost Courses · Silent Disengagement · Academic Integrity")+
    `<h3 style="margin:12px 0 8px">1. Cohort Progression & Transfer Funnel (Year 1 → Year 4)</h3>`+
    renderCohortFunnelCard(false)+
    `<h3 style="margin:16px 0 8px">2. Lecturer Activity & "Ghost Course" Detector</h3>`+
    renderGhostCoursesTable(false)+
    `<h3 style="margin:16px 0 8px">3. Silent Disengagement / Zero-Login Early Alert (14+ Days)</h3>`+
    renderSilentDisengagementTable(false)+
    `<h3 style="margin:16px 0 8px">4. Academic Integrity & Plagiarism Flag Log</h3>`+
    renderIntegrityTable(false);
  },
  res(){return unitView("modules","My units","Objective 1 · Weekly syllabus topics, slides, quizzes & discussions")},
  quiz(){return unitView("quiz","Quizzes by unit & topic"," Topic-aligned timed quizzes with auto-marking")},
  disc(){return unitView("disc","Discussions by unit & topic","Objective 5 · Topic-organized course discussion boards")},
  time(){
    const mine=myUnitIndices();
    const classSlots=S.timetable.map((s,idx)=>({s,idx})).filter(({s})=>mine.includes(s.c));
    const quizSlots=S.quizzes.map((q,idx)=>({q,idx})).filter(({q})=>mine.includes(q.c));

    // Build day-indexed study plan map (fallback to default balanced preview if not generated yet)
    const studyByDay={};
    DAYS.forEach(d=>studyByDay[d]=[]);
    if(S.plan?.days){
      S.plan.days.forEach(dObj=>{
        const dayName=DAYS[dObj.dow];
        dObj.it.forEach(item=>{
          const t=S.tasks[item.idx];
          if(t)studyByDay[dayName].push({task:t,hours:item.hours});
        });
      });
    }

    const adminControls=S.role!=="Student"?`<div class="card">
      <b>Schedule Class or Set Quiz on Weekly Timetable</b>
      <div class="row" style="margin-top:8px">
        <select id="tc">${mine.map(i=>`<option value="${i}">${esc(S.units[i].code)}</option>`).join("")}</select>
        <select id="tday">${DAYS.map(d=>`<option>${d}</option>`).join("")}</select>
        <input id="ttime" placeholder="Time (e.g. 10:00 – 12:00)" style="width:165px">
        <input id="tvenue" placeholder="Venue / Lab" style="flex:1">
        <select id="ttype"><option>Lecture</option><option>Practical Lab</option><option>Tutorial</option></select>
        <button class="sm" onclick="addTimetableSlot()">+ Class slot</button>
      </div>
      <div class="row" style="margin-bottom:0">
        <select id="tq_sel" style="flex:2">${quizSlots.map(({q,idx})=>`<option value="${idx}">${esc(S.units[q.c]?.code)} — ${esc(q.t)} (${q.day||"Unscheduled"})</option>`).join("")}</select>
        <select id="tq_day">${DAYS.map(d=>`<option>${d}</option>`).join("")}</select>
        <input id="tq_time" value="14:00" placeholder="Quiz time" style="width:110px">
        <button class="ghost sm" onclick="scheduleQuizSlot()">Set Quiz Day</button>
      </div>
    </div>`:"";

    const studyBanner=S.role==="Student"?`<div class="row" style="justify-content:space-between">
      <small>Showing weekly <b>Classes</b>, <b>Set Quizzes</b>, and <b>Study Time</b>${S.plan?" (synced with your Study Planner)":" (click Generate Study Blocks to populate your personalized study slots)"}.</small>
      <button class="ghost sm" onclick="computePlan(false)">${S.plan?"Re-balance Study Time":"Generate Study Time Blocks"}</button>
    </div>`:"";

    const classesRow=`<tr>
      <td>🏫 <b>Classes</b><br><small>Lectures & Labs</small></td>
      ${DAYS.map(day=>{
        const items=classSlots.filter(({s})=>s.day===day);
        return `<td>${items.length?items.map(({s,idx})=>`<div class="tt-slot">
          <div class="row" style="justify-content:space-between;margin:0">
            <b>${esc(S.units[s.c]?.code)}</b>
            ${S.role!=="Student"?`<button class="link" style="font-size:12px" onclick="S.timetable.splice(${idx},1);R()">×</button>`:""}
          </div>
          <small>${esc(s.time)}<br>${esc(s.venue)} (${esc(s.type)})</small>
        </div>`).join(""):"<small>No classes</small>"}</td>`;
      }).join("")}
    </tr>`;

    const quizzesRow=`<tr>
      <td>📝 <b>Set Quizzes</b><br><small>Timed Assessments</small></td>
      ${DAYS.map(day=>{
        const items=quizSlots.filter(({q})=>q.day===day);
        return `<td>${items.length?items.map(({q,idx})=>`<div class="tt-slot quiz">
          <b>${esc(S.units[q.c]?.code)}</b>: ${esc(q.t)}<br>
          <small>⏰ ${esc(q.time||"All day")} · ${q.mins||10} mins</small>
          ${S.role==="Student"?`<div style="margin-top:4px"><button class="sm" style="padding:2px 8px;min-height:26px;font-size:11.5px" onclick="S.view='quiz';openU(${q.c},'quiz');startQuiz(${idx})">Take Quiz</button></div>`:""}
        </div>`).join(""):"<small>No quizzes</small>"}</td>`;
      }).join("")}
    </tr>`;

    const studyRow=`<tr>
      <td>📖 <b>Study Time</b><br><small>${S.role==="Student"?"Planned & Free Hrs":"Recommended Prep"}</small></td>
      ${DAYS.map((day,dIdx)=>{
        const net=netFreeHoursForDay(dIdx);
        const blocks=studyByDay[day]||[];
        if(S.role!=="Student"){
          const unitCodes=[...new Set(classSlots.filter(({s})=>s.day===day).map(({s})=>S.units[s.c]?.code))];
          return `<td><div class="tt-slot study"><small>${unitCodes.length?`Office hours / prep for <b>${unitCodes.join(", ")}</b>`:"Research & grading block"}</small></div></td>`;
        }
        return `<td>
          ${blocks.length?blocks.map(b=>`<div class="tt-slot study">
            <b>${esc(S.units[b.task.c]?.code)}</b>: ${esc(b.task.t)}<br>
            <small>⏱ ${b.hours}h study block</small>
          </div>`).join(""):""}
          <small>${net}h net free capacity</small>
        </td>`;
      }).join("")}
    </tr>`;

    return H("Weekly Master Timetable","Classes, Set Quizzes, and Study Time in one unified schedule")+
    adminControls+
    studyBanner+
    `<div class="card">
      <table class="tt-table">
        <thead>
          <tr>
            <th>Schedule Type</th>
            ${DAYS.map((d,idx)=>`<th>${d}<br><small style="font-weight:400">${lectureHoursForDay(idx)}h class</small></th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${classesRow}
          ${quizzesRow}
          ${studyRow}
        </tbody>
      </table>
    </div>`;
  },
  tasks(){
    const mine=myUnitIndices(), all=[...pend(),...myTasks().filter(t=>taskForMe(t).done)];
    return H("Tasks and deadlines"," Task manager with effort tracking")+`<div class="card"><div class="row"><input id="nt" placeholder="New task" style="flex:1"><select id="nc">${mine.map(i=>`<option value=${i}>${esc(S.units[i].code)}</option>`).join("")}</select><input id="nd" type="date"><input id="nw" type="number" min="1" max="100" placeholder="Weight %" style="width:105px"><input id="nh" type="number" min="1" max="40" placeholder="Est. hrs" style="width:95px"><button onclick="addTask()">Add</button></div><small>Priority = grade weight ÷ days remaining. Effort estimates feed directly into your Study Planner.</small></div><div class="card">${all.map(t=>{
      const me=taskForMe(t),idx=S.tasks.indexOf(t),p=Math.min(100,Math.round(me.lh/me.est*100));
      return `<div class="item">
        <label class="${me.done?"done":""}" style="flex:1">
          <input type="checkbox" ${me.done?"checked":""} ${t.a?"disabled":""} onchange="S.tasks[${idx}].done=this.checked?1:0;if(S.plan)computePlan(true);else R()"> ${esc(t.t)}<br>
          <small>${esc(U(t.c))} · due ${fd(D(t.d))} · ${t.w}% · <span class="bar sm"><i style="width:${p}%"></i></span>${me.lh}/${me.est}h studied${t.a?" · "+me.status:""}</small>
        </label>
        <div class="row" style="margin:0">
          ${!me.done?`<button class="ghost sm" onclick="logStudyHour(${idx},1)">+1h</button>`:""}
          ${t.a&&!me.done?`<button class="ghost sm" onclick="S.view='res';openU(${t.c},'assign')">Submit</button>`:`<span class="${me.done?"lo":pr(t)[1][1]}">${me.done?(me.mark!==null?me.mark+"%":"Done"):pr(t)[1][0]}</span>`}
        </div>
      </div>`;
    }).join("")||"<small>No tasks for your enrolled units.</small>"}</div>`;
  },
  plan(){
    const pendingList=pend();
    const weeklyNet=DAYS.reduce((a,_,i)=>a+netFreeHoursForDay(i),0);
    const needed=pendingList.reduce((a,t)=>a+remHours(t),0);
    const activeFocusIdx=S.pomo.taskIdx!==null?S.pomo.taskIdx:(pendingList[0]?S.tasks.indexOf(pendingList[0]):null);

    return H("Study planner & Focus timer"," Timetable-aware schedule & Focus sessions")+
    `<div class="pomo">
      <div>
        <small><b> FOCUS TIMER (25 MIN)</b></small>
        <div id="pomoclock" class="pomo-clock">${fmtSec(S.pomo.rem)}</div>
      </div>
      <div style="flex:1;min-width:200px">
        <small>Focus task (+0.5h auto-logged on completion):</small>
        <select style="width:100%;margin-top:4px;min-height:38px" onchange="S.pomo.taskIdx=+this.value">
          ${pendingList.map(t=>{const k=S.tasks.indexOf(t);return `<option value="${k}" ${activeFocusIdx===k?"selected":""}>${esc(S.units[t.c]?.code)} — ${esc(t.t)} (${remHours(t)}h left)</option>`}).join("")||`<option value="">All tasks completed!</option>`}
        </select>
      </div>
      <div class="row" style="margin:0">
        <button class="sm" onclick="togglePomo()">${S.pomo.running?"Pause":"Start focus"}</button>
        <button class="ghost sm" onclick="resetPomo()">Reset</button>
        <button class="ghost sm" onclick="completePomoSession()">Finish & log +0.5h</button>
      </div>
    </div>`+

    `<div class="card">
      <div class="row" style="justify-content:space-between"><b>Daily study budget (after subtracting timetable lectures)</b><small>Net weekly capacity: <b>${weeklyNet}h</b> · Pending workload: <b>${needed}h</b></small></div>
      <div class="row">${DAYS.map((day,i)=>{
        const lec=lectureHoursForDay(i), net=netFreeHoursForDay(i);
        return `<label style="min-width:78px">${day} <small>(-${lec}h lec)</small><br><input type="number" min="0" max="14" value="${S.av[i]}" style="width:68px" onchange="S.av[${i}]=Math.max(0,+this.value||0);if(S.plan)computePlan(true);else R()"><br><small>Net: <b>${net}h</b></small></label>`;
      }).join("")}</div>
      <button onclick="computePlan(false)">Generate / Re-balance plan</button>
    </div>`+
    (S.plan?.warnings?.length?`<div class="alert"><b>⚠️ Schedule Overload Warnings</b><ul style="margin:6px 0 0;padding-left:18px">${S.plan.warnings.map(w=>`<li><small style="color:var(--ink)">${esc(w)}</small></li>`).join("")}</ul></div>`:"")+
    (S.plan?S.plan.days.map(d=>`<div class="card"><b>${new Date(d.d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}</b> <small>(${d.lecHrs}h lectures · ${netFreeHoursForDay(d.dow)}h net study capacity)</small>${d.it.length?d.it.map(item=>{
      const t=S.tasks[item.idx];
      if(!t)return "";
      const lh=loggedHours(t), est=t.h||1;
      return `<div class="item">
        <div><b>${esc(t.t)}</b><br><small>${esc(U(t.c))} · Progress: ${lh}/${est}h studied</small></div>
        <div class="row" style="margin:0">
          <span class="tag">${item.hours} h planned</span>
          ${!taskForMe(t).done?`<button class="ghost sm" onclick="logStudyHour(${item.idx},1)">Log 1h studied</button>`:`<span class="lo">Done</span>`}
        </div>
      </div>`;
    }).join(""):"<div><small>Rest day or classes only</small></div>"}</div>`).join(""):"<small>Click Generate to build a weekly study plan around your class timetable.</small>");
  },
  prog(){
    const g=grade(),mine=myUnitIndices();
    const ungraded=myTasks().filter(t=>taskForMe(t).mark===null);
    let gradedW=0, gradedMW=0;
    myTasks().forEach(t=>{const m=taskForMe(t).mark;if(m!==null){gradedW+=t.w;gradedMW+=m*t.w}});
    let simW=gradedW, simMW=gradedMW;
    ungraded.forEach((t,idx)=>{
      const val=S.simMarks[idx]!==undefined?S.simMarks[idx]:70;
      simW+=t.w;simMW+=val*t.w;
    });
    const finalExamW=Math.max(0,100-simW);
    const examSim=S.simMarks["exam"]!==undefined?S.simMarks["exam"]:70;
    const projected=Math.round((simMW+examSim*finalExamW)/100);
    const honours=projected>=70?"First Class Honours (70%+)":projected>=60?"Second Class Upper (60–69%)":projected>=50?"Second Class Lower (50–59%)":"Pass (40–49%)";

    return H("Progress & Grade Simulator"," Progress dashboard & What-If calculator")+
    `<div class="grid"><div class="card stat"><b>${pct()}%</b>All tasks completed</div><div class="card stat"><b>${g.avg}%</b>Current graded average</div><div class="card stat"><b>${g.need}%</b>Needed on remaining work for 70%</div></div>`+
    `<div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b>🎯 Interactive "What-If" Grade Simulator</b><br><small>Drag sliders to test target scores on remaining coursework and final exams</small></div>
        <div style="text-align:right"><b style="font-size:22px;color:var(--pri)">${projected}%</b><br><span class="${projected>=70?"lo":projected>=60?"med":"hi"}">${honours}</span></div>
      </div>
      ${ungraded.map((t,idx)=>{
        const val=S.simMarks[idx]!==undefined?S.simMarks[idx]:70;
        return `<div class="item">
          <div style="flex:1"><b>${esc(t.t)}</b> <small>(${esc(S.units[t.c]?.code)} · Weight ${t.w}%)</small></div>
          <input type="range" min="0" max="100" value="${val}" oninput="S.simMarks[${idx}]=+this.value;R()">
          <b style="width:44px;text-align:right">${val}%</b>
        </div>`;
      }).join("")}
      ${finalExamW>0?`<div class="item">
        <div style="flex:1"><b>Final End-of-Semester Exams</b> <small>(Remaining weight ${finalExamW}%)</small></div>
        <input type="range" min="0" max="100" value="${examSim}" oninput="S.simMarks['exam']=+this.value;R()">
        <b style="width:44px;text-align:right">${examSim}%</b>
      </div>`:""}
    </div>`+
    `<div class="grid">${mine.map(i=>{const u=S.units[i],s=ust(i),att=studentAttendancePct(S.user.name,i);return `<div class="card"><b>${esc(u.code)}</b> <small>${esc(u.name)}</small><p>Tasks done: ${s.d} of ${s.n} · Attendance: <b>${att}%</b></p><div class="bar"><i style="width:${s.p}%"></i></div><p>Quiz average: ${s.qa===null?"none yet":s.qa+"%"}<br>Marks so far: ${s.m===null?"none yet":s.m+"%"}</p></div>`}).join("")}</div>`;
  },
  att(){
    const mine=myUnitIndices();
    return H("Lecture Attendance Roll Call","Feeds directly into Class Progress early-alert risk detection")+
    `<div class="card">
      <b>Record new session attendance</b>
      <div class="row" style="margin-top:8px">
        <select id="att_u">${mine.map(i=>`<option value="${i}">${esc(S.units[i].code)} — ${esc(S.units[i].name)}</option>`).join("")}</select>
        <input id="att_label" placeholder="Session label (e.g. Week 6 – Mon Lecture)" style="flex:1">
        <button class="sm" onclick="createAttendanceSession()">Start roll call</button>
      </div>
    </div>`+
    S.attendance.map((ses,sIdx)=>({ses,sIdx})).filter(({ses})=>mine.includes(ses.c)).map(({ses,sIdx})=>`<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <div><b>${esc(U(ses.c))}</b> · <span class="tag">${esc(ses.date)}</span></div>
        <button class="ghost sm" onclick="S.attendance.splice(${sIdx},1);R()">Delete</button>
      </div>
      ${S.units[ses.c].students.map(stName=>{
        const cur=ses.records[stName]||"Present";
        return `<div class="item" style="padding:6px 0">
          <span>${esc(stName)}</span>
          <div class="row" style="margin:0">
            ${["Present","Late","Absent"].map(st=>`<button class="pill ${cur===st?"":"ghost"}" onclick="S.attendance[${sIdx}].records['${esc(stName)}']='${st}';R()">${st}</button>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
  },
  cls(){
    const mine=myUnitIndices(), riskList=computeAtRiskStudents();
    return H("Class progress by unit","Objective 6 · Live analytics & early-alert risk detection")+`<div class="grid">${mine.map(i=>{
      const u=S.units[i],asgs=S.tasks.filter(t=>t.a&&t.c===i),totSlots=asgs.length*stu(i);
      const subSlots=asgs.reduce((acc,t)=>acc+Object.keys(t.subs||{}).length,0);
      const subPct=totSlots?Math.round(subSlots/totSlots*100):0;
      const allScores=ofU(S.quizzes,i).flatMap(q=>Object.values(q.attempts||{}).flat().map(a=>a.score));
      const qAvg=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length):0;
      const unitRisks=riskList.filter(r=>r.unit.startsWith(u.code)).length;
      return `<div class="card"><b>${esc(u.code)}</b> <small>${esc(u.name)}</small><p>${stu(i)} students<br>Assignments submitted: ${subPct}%</p><div class="bar"><i style="width:${subPct}%"></i></div><p>Class quiz average: ${qAvg}%<br><span class="${unitRisks?"hi":"lo"}">${unitRisks} student${unitRisks===1?"":"s"} flagged for support</span></p></div>`;
    }).join("")}</div>
    <b>Students needing support (auto-detected from attendance, quiz scores & missing work)</b>`+
    (riskList.length?tbl(["Student","Unit","Attendance","Quiz Avg","Risk Factors"],riskList.map(r=>[esc(r.student),esc(r.unit),`<span class="${r.attPct<75?"hi":"lo"}">${r.attPct}%</span>`,esc(r.qAvg),`<span class="hi">${esc(r.reasons)}</span>`])):`<div class="card"><small>No students currently flagged at risk across your units.</small></div>`);
  },
  msgs(){
    const st=S.role=="Student",mine=myUnitIndices();
    return H("Messages and announcements"," Announcements and messages")+`<div class="card">${S.msgs.map(m=>`<div class="item"><div>${esc(m.t)}<br><small>${esc(m.f)} · ${esc(U(m.c))}</small></div></div>`).join("")}</div><div class="card"><div class="row"><select id="mu">${mine.map(i=>`<option value=${i}>${esc(S.units[i].code)}</option>`).join("")}</select><input id="mt" placeholder="${st?"Message your instructor":"Write an announcement"}" style="flex:1"><button onclick="postMessage()">${st?"Send":"Post"}</button></div></div>`;
  },
  usr(){
    const instructors=allInstructors(),students=allStudents();
    return H("Users and units","Objective 1 · Unit creation, instructor assignment & student enrollment")+
    `<div class="card">
      <b>1. Create a new unit & assign instructor</b>
      <div class="row" style="margin-top:8px">
        <input id="ucode" placeholder="Unit code (e.g. CSC 315)" style="width:170px">

function stageQuestion(){
  const q=$("#qq").value.trim();
  const opts=[$("#qo0").value.trim(),$("#qo1").value.trim(),$("#qo2").value.trim(),$("#qo3").value.trim()].filter(Boolean);
  const cor=+$("#qcor").value, exp=$("#qexp").value.trim();
  if(!q||opts.length<2)return toast("Enter a question and at least 2 options");
  if(cor>=opts.length)return toast("Selected correct option is empty");
  S.qDraft.push({q,o:opts,a:cor,exp});
  const keepTitle=$("#qt").value, keepTopic=$("#qtopic").value, keepDay=$("#qday").value, keepTime=$("#qtime").value, keepMins=$("#qmins").value, keepAtt=$("#qatt").value, keepPass=$("#qpass").value;
  R();
  $("#qt").value=keepTitle;$("#qtopic").value=keepTopic;$("#qday").value=keepDay;$("#qtime").value=keepTime;$("#qmins").value=keepMins;$("#qatt").value=keepAtt;$("#qpass").value=keepPass;
  toast(`Question ${S.qDraft.length} added to quiz`);
}
function publishQuiz(i){
  const t=$("#qt").value.trim(), topicId=$("#qtopic").value||null, day=$("#qday").value, time=$("#qtime").value.trim()||"10:00", mins=Math.max(1,+$("#qmins").value||10), maxAtt=+$("#qatt").value||0, pass=Math.min(100,Math.max(1,+$("#qpass").value||50));
  if(!t)return toast("Enter a quiz title");
  if(!S.qDraft.length)return toast("Add at least one question before publishing");
  S.quizzes.push({c:i,topicId,day,time,t,mins,maxAtt,pass,qs:[...S.qDraft],attempts:{}});
  S.qDraft=[];R();toast("Quiz published & added to weekly timetable");
}
function deleteQuiz(k){S.quizzes.splice(k,1);R();toast("Quiz deleted")}

function startQuiz(k){
  stopQuizTimer();
  const q=S.quizzes[k];
  S.qi=k;S.qs={i:0,ans:[],fin:false,rem:(q.mins||10)*60,timedOut:false,tid:null,startedAt:Date.now()};
  S.qs.tid=setInterval(()=>{
    if(!S.user||S.qi===null||S.qs.fin){stopQuizTimer();return}
    S.qs.rem--;
    const el=$("#qtimer");
    if(el){el.textContent="⏱ "+fmtSec(Math.max(0,S.qs.rem));if(S.qs.rem<=60)el.classList.add("urgent")}
    if(S.qs.rem<=0)finishQuiz(true);
  },1000);
  R();
}
function ans(j){const s=S.qs, q=S.quizzes[S.qi];s.ans.push(j);if(++s.i>=q.qs.length)finishQuiz(false);else R()}
function finishQuiz(timedOut){
  stopQuizTimer();
  const s=S.qs, q=S.quizzes[S.qi];
  s.fin=true;s.timedOut=timedOut;
  const elapsedSec=Math.max(1,Math.round((Date.now()-(s.startedAt||Date.now()))/1000));
  const n=q.qs.filter((x,j)=>s.ans[j]===x.a).length;
  const score=Math.round(n/q.qs.length*100);
  q.attempts=q.attempts||{};
  q.attempts[S.user.name]=q.attempts[S.user.name]||[];
  q.attempts[S.user.name].push({score,ans:[...s.ans],timedOut});
  if(!timedOut && elapsedSec < q.qs.length * 4){
    S.integrityFlags.unshift({
      id:"INT-"+(105+S.integrityFlags.length),
      student:S.user.name,
      unit:S.units[q.c]?.code||"UNIT",
      type:"Quiz Speed Anomaly",
      detail:`Completed "${q.t}" (${q.qs.length} questions) in ${elapsedSec}s.`,
      severity:"Medium",
      status:"Flagged",
      date:"Just now"
    });
  }
  R();
  if(timedOut)toast("Time's up! Quiz auto-submitted.");
}
function reviewLastQuiz(k){
  stopQuizTimer();
  const q=S.quizzes[k], list=q.attempts?.[S.user.name]||[];
  if(!list.length)return;
  const last=list[list.length-1];
  S.qi=k;S.qs={i:q.qs.length,ans:last.ans,fin:true,rem:0,timedOut:last.timedOut,tid:null,startedAt:0};
  R();
}

  S.tasks.push({t,c:i,d:Math.max(0,Math.ceil((new Date(d)-new Date())/864e5)),w:+$("#aw").value||5,h:Math.max(1,+$("#ah").value||3),logged:{},done:0,a:1,subs:{}});
  S.units[i].students.forEach(st=>pushNotif(st,`New assignment "${t}" posted in ${S.units[i].code}.`));

function submitA(k){
  const fileEl=$("#ffile"+k), typed=$("#f"+k).value.trim();
  const f=fileEl?.files?.[0];
  if(!f && !typed)return toast("Choose a file or enter a file name");
  let blobKey=null, fileName=typed;
  if(f){
    blobKey="sub_"+Date.now();
    FILE_BLOBS[blobKey]={url:URL.createObjectURL(f),type:f.type||"application/octet-stream",name:f.name};
    fileName=f.name;
  }
  const t=S.tasks[k];
  t.subs=t.subs||{};
  t.subs[S.user.name]={file:fileName,blobKey,mark:null,fb:"",status:"Submitted",note:`Submitted by ${S.user.name}.`};
  const ins=S.units[t.c]?.ins;
  if(ins)pushNotif(ins,`${S.user.name} submitted ${fileName} for "${t.t}".`);
  if(S.plan)computePlan(true);else R();
  toast("Assignment submitted to instructor");
}
function saveGrade(k,stName,idx,status){
  const raw=$("#mk_"+k+"_"+idx).value, fb=$("#fb_"+k+"_"+idx).value.trim();
  if(raw===""||isNaN(+raw)||+raw<0||+raw>100)return toast("Enter a valid score between 0 and 100");
  const mark=Math.round(+raw);
  Object.assign(S.tasks[k].subs[stName],{mark,fb,status});
  if(status==="Released")pushNotif(stName,`${S.user.name} released your grade (${mark}%) for "${S.tasks[k].t}".`);
  R();toast(status==="Released"?`Grade released to ${stName}`:`Draft grade saved for ${stName}`);
}
function releaseGrades(k){
  const subs=S.tasks[k].subs||{};
  Object.entries(subs).forEach(([stName,s])=>{
    if(s.status==="Draft"&&s.mark!==null){
      s.status="Released";
      pushNotif(stName,`${S.user.name} released your grade (${s.mark}%) for "${S.tasks[k].t}".`);
    }
  });
  R();toast("All graded marks released to students");
}

  </div>`;
}

function authView(){const l=S.mode=="login";return `<div class="auth"><div class="logo">🎓</div><h1>University StudyHub</h1><small style="display:block;text-align:center">Study resources and academic planning in one place</small><div style="text-align:center;margin-top:8px"><span class="obj"> Accounts and role-based access</span></div><div class="tabs"><button class="${l?"":"ghost"}" onclick="setMode('login')">Log in</button><button class="${l?"ghost":""}" onclick="setMode('signup')">Sign up</button></div><div class="card">`+(l?`<label class="fld"><span>Email</span><input id="e" type="email" placeholder="you@university.ac.ke" autocomplete="username"></label><label class="fld"><span>Password</span><input id="p" type="password" autocomplete="current-password"></label><div class="err">${esc(S.err)}</div><button style="width:100%" onclick="doLogin()">Log in</button><p><button class="link" onclick="toast('A reset link would be emailed to you')">Forgot password?</button></p><small></small><div class="demo"><button class="ghost" onclick="fill('student@university.ac.ke','student123')">Student (Tonny)</button><button class="ghost" onclick="fill('instructor@university.ac.ke','instructor123')">Instructor (Grace)</button><button class="ghost" onclick="fill('admin@university.ac.ke','admin123')">Administrator</button></div>`:`<label class="fld"><span>Full name</span><input id="n" autocomplete="name"></label><label class="fld"><span>Email</span><input id="e" type="email" placeholder="you@university.ac.ke" autocomplete="username"></label><label class="fld"><span>I am a</span><select id="r"><option>Student</option><option>Instructor</option></select></label><label class="fld"><span>Password (6+ characters)</span><input id="p" type="password" autocomplete="new-password"></label><label class="fld"><span>Confirm password</span><input id="p2" type="password" autocomplete="new-password"></label><div class="err">${esc(S.err)}</div><button style="width:100%" onclick="doSignup()">Create account</button>`)+`</div></div><div id="toast"></div>`}
const setMode=m=>{S.mode=m;S.err="";R()},fill=(e,p)=>{S.mode="login";S.err="";R();$("#e").value=e;$("#p").value=p};
function err(m){const v={e:$("#e").value,n:$("#n")?$("#n").value:"",r:$("#r")?$("#r").value:""};S.err=m;R();["e","n","r"].forEach(k=>{if(v[k]&&$("#"+k))$("#"+k).value=v[k]})}
function start(a){stopQuizTimer();stopPomo();a.lastLoginDays=0;S.user={name:a.n,email:a.e};S.role=a.r;S.view="dash";S.unit=null;S.resCat="All";S.topicFilter="All";S.weekFilter="All";S.ot=null;S.qi=null;S.gradeAsg=null;S.qDraft=[];S.showNotifs=false;S.search="";S.err="";R();toast("Welcome, "+a.n.split(" ")[0])}
function doLogin(){const e=$("#e").value.trim().toLowerCase(),p=$("#p").value;if(!e||!p)return err("Enter your email and password.");const a=S.acc.find(x=>x.e==e&&x.p==p);if(!a)return err("Incorrect email or password.");start(a)}
function doSignup(){const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase(),p=$("#p").value,p2=$("#p2").value,r=$("#r").value;let m="";if(!n||!e||!p)m="Fill in all fields.";else if(!/^\S+@\S+\.\S+$/.test(e))m="Enter a valid email address.";else if(S.acc.some(x=>x.e==e))m="An account with this email already exists.";else if(p.length<6)m="Password must be at least 6 characters.";else if(p!=p2)m="Passwords do not match.";if(m)return err(m);const a={e,p,n,r,year:1,lastLoginDays:0,feeStatus:"Cleared"};S.acc.push(a);start(a)}
function logout(){stopQuizTimer();stopPomo();S.user=null;S.mode="login";S.err="";R();toast("You have been logged out")}

function R(){
  saveState();
  if(!S.user){$("#app").innerHTML=authView();return}
  const unread=myNotifs().filter(n=>!n.read).length;
  const activeId=document.activeElement?.id;
  const selStart=document.activeElement?.selectionStart;

  $("#app").innerHTML=`<header>
    <b>🎓 University StudyHub</b>
    <input id="gsearch" class="gsearch" value="${esc(S.search)}" placeholder="Search topics, slides, quizzes..." oninput="S.search=this.value;R()">
    <span class="sp"></span>
    <span>${esc(S.user.name)} · ${esc(S.role)}</span>
    <button onclick="S.showNotifs=!S.showNotifs;R()" title="Notifications">🔔${unread?`<span class="badge">${unread}</span>`:""}</button>
    <button onclick="toggleTheme()" title="Toggle Light / Dark theme">🌓</button>
    <button onclick="resetDemo()" title="Restore default sample data">Reset</button>
    <button onclick="logout()">Log out</button>
  </header>
  ${renderSearchOverlay()}
  ${renderNotifsPopover()}
  ${renderPreviewModal()}
  <div class="app">
    <nav>${NAV[S.role].map(([k,l])=>`<a class="${k==S.view?"on":""}" onclick="stopQuizTimer();S.view='${k}';S.unit=null;S.resCat='All';S.topicFilter='All';S.weekFilter='All';S.ot=null;S.qi=null;S.gradeAsg=null;S.showNotifs=false;R()">${l}</a>`).join("")}</nav>
    <main>${V[S.view]()}<p><small> Click Reset to restore default data.</small></p></main>
  </div>
  <div id="toast"></div>`;

  if(activeId==="gsearch" && $("#gsearch")){
    const el=$("#gsearch");
    el.focus();
    if(typeof selStart==="number")el.setSelectionRange(selStart,selStart);
  }
}
R();
</script></body></html>
